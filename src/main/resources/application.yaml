spring:
  application:
    name: TicketProject

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5442/ticket_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true

  web:
    error:
      include-message: always

jwt:
  secret: VGhpc0lzQVNlY3VyZVNlY3JldEtleUZvclRva2VuMTIzNDU2Nzg5
  expiration: 86400000

logging:
  file:
    name: logs/ticket-project.log

  level:
    root: INFO
    com.susanthika.TicketProject: DEBUG


springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html