version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: ticket-project
    restart: always
    environment:
      POSTGRES_DB: ticket_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:
      - "5442:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: